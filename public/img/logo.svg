<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #000;">
  <!-- 
    Logo Design: "幸运币安星" (The Lucky Binance Star)
    Designer: Gemini
    Concept: A fusion of the geometric BNB diamond and the organic four-leaf clover, 
             symbolizing luck born from the Binance ecosystem.
  -->

  <!-- 1. Definitions: A sharp gold gradient and a subtle, premium glow -->
  <defs>
    <linearGradient id="sharpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEB99;" />
      <stop offset="50%" style="stop-color:#FFD700;" />
      <stop offset="100%" style="stop-color:#F0B90B;" />
    </linearGradient>
    <filter id="premiumGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 2. The Symbol: A geometric four-leaf clover derived from the BNB diamond -->
  <g transform="translate(100, 100)" filter="url(#premiumGlow)">
    
    <!-- The main shape, created using curved paths for an organic-yet-sharp feel -->
    <path 
      d="M0,-80 Q 50,-50 80,0 Q 50,50 0,80 Q -50,50 -80,0 Q -50,-50 0,-80 Z"
      fill="url(#sharpGold)"
    />

    <!-- The central negative space, creating the inner diamond shape -->
    <path 
      d="M0,-25 L25,0 L0,25 L-25,0 Z"
      fill="#000"
    />
    
  </g>
</svg>